[workspace]
members = ["crates/core", "crates/platform", "crates/media", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
wireless-display-core = { path = "crates/core" }
wireless-display-platform = { path = "crates/platform" }
wireless-display-media = { path = "crates/media" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_8"] }
gst = { package = "gstreamer", version = "0.25.4", features = ["v1_22"] }
gst-net = { package = "gstreamer-net", version = "0.25.0", features = ["v1_22"] }
gio = "0.22.10"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
# ashpd 0.13 uses zbus 5.x. Keep one D-Bus type family.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
async-channel = "2.5.0"
futures-util = "0.3.34"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0

[profile.test]
debug = 0
